<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kutay Gunal</title>
  <desc id="desc">AI applications, systems software, and performance engineering</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="190" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="108" cy="278" r="150" fill="#8b5cf6" opacity="0.09" filter="url(#blur)"/>

  <g opacity="0.7" fill="none" stroke-linecap="round">
    <path d="M880 86L970 48L1060 91L1125 52" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M902 188L982 142L1076 186L1142 134" stroke="#a78bfa" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M970 48L982 142M1060 91L1076 186M1125 52L1142 134" stroke="#64748b" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="880" cy="86" r="6" fill="#22d3ee" stroke="none"/>
    <circle cx="970" cy="48" r="5" fill="#60a5fa" stroke="none"/>
    <circle cx="1060" cy="91" r="7" fill="#a78bfa" stroke="none"/>
    <circle cx="1125" cy="52" r="4" fill="#22d3ee" stroke="none"/>
    <circle cx="902" cy="188" r="4" fill="#a78bfa" stroke="none"/>
    <circle cx="982" cy="142" r="6" fill="#22d3ee" stroke="none"/>
    <circle cx="1076" cy="186" r="5" fill="#60a5fa" stroke="none"/>
    <circle cx="1142" cy="134" r="7" fill="#a78bfa" stroke="none"/>
  </g>

  <rect x="70" y="62" width="54" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="130" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="1">KUTAY GUNAL</text>
  <text x="72" y="174" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" letter-spacing="3">AI APPLICATIONS  ·  SYSTEMS SOFTWARE  ·  PERFORMANCE</text>
  <text x="72" y="225" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">intelligence × infrastructure × evidence</text>

  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
</svg>
