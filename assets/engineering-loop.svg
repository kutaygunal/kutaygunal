<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The engineering loop I trust</title>
  <desc id="desc">Understand the failure mode, model the system, observe behavior, test against reality, then ship, measure, refine, and feed the evidence back into understanding.</desc>
  <defs>
    <linearGradient id="loop-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="loop-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="loop-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="loop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="feedback-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#loop-bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#loop-grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="url(#loop-line)" stroke-opacity="0.25" stroke-width="2"/>

  <text x="48" y="44" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" letter-spacing="1.4">THE ENGINEERING LOOP</text>
  <text x="48" y="69" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Confidence is not assumed. It is built, tested, and fed back into the system.</text>
  <text x="1152" y="48" text-anchor="end" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">EVIDENCE → CONFIDENCE</text>

  <g stroke="#64748b" stroke-opacity="0.65" stroke-width="2" marker-end="url(#arrow)">
    <path d="M245 177H268"/>
    <path d="M460 177H483"/>
    <path d="M675 177H698"/>
    <path d="M890 177H913"/>
  </g>

  <g filter="url(#loop-shadow)">
    <g>
      <rect x="48" y="103" width="197" height="148" rx="15" fill="#142236" stroke="#274058"/>
      <rect x="48" y="103" width="197" height="5" rx="2.5" fill="#22d3ee"/>
      <circle cx="76" cy="135" r="15" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="76" y="140" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">01</text>
      <text x="101" y="141" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">UNDERSTAND</text>
      <text x="68" y="179" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
        <tspan x="68" dy="0">Find the real failure</tspan>
        <tspan x="68" dy="20">mode—not just its</tspan>
        <tspan x="68" dy="20">visible symptom.</tspan>
      </text>
    </g>

    <g>
      <rect x="263" y="103" width="197" height="148" rx="15" fill="#142236" stroke="#274058"/>
      <rect x="263" y="103" width="197" height="5" rx="2.5" fill="#38bdf8"/>
      <circle cx="291" cy="135" r="15" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="291" y="140" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">02</text>
      <text x="316" y="141" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">MODEL</text>
      <text x="283" y="179" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
        <tspan x="283" dy="0">Map the system, its</tspan>
        <tspan x="283" dy="20">constraints, and the</tspan>
        <tspan x="283" dy="20">trade-offs that matter.</tspan>
      </text>
    </g>

    <g>
      <rect x="478" y="103" width="197" height="148" rx="15" fill="#142236" stroke="#274058"/>
      <rect x="478" y="103" width="197" height="5" rx="2.5" fill="#60a5fa"/>
      <circle cx="506" cy="135" r="15" fill="#60a5fa" fill-opacity="0.13" stroke="#60a5fa" stroke-opacity="0.55"/>
      <text x="506" y="140" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">03</text>
      <text x="531" y="141" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">OBSERVE</text>
      <text x="498" y="179" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
        <tspan x="498" dy="0">Instrument the path.</tspan>
        <tspan x="498" dy="20">Make hidden behavior</tspan>
        <tspan x="498" dy="20">visible and explainable.</tspan>
      </text>
    </g>

    <g>
      <rect x="693" y="103" width="197" height="148" rx="15" fill="#142236" stroke="#274058"/>
      <rect x="693" y="103" width="197" height="5" rx="2.5" fill="#818cf8"/>
      <circle cx="721" cy="135" r="15" fill="#818cf8" fill-opacity="0.13" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="721" y="140" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">04</text>
      <text x="746" y="141" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">TEST</text>
      <text x="713" y="179" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
        <tspan x="713" dy="0">Challenge assumptions</tspan>
        <tspan x="713" dy="20">with reality, edge cases,</tspan>
        <tspan x="713" dy="20">and reproducible evidence.</tspan>
      </text>
    </g>

    <g>
      <rect x="908" y="103" width="244" height="148" rx="15" fill="#17223a" stroke="#4c3d75"/>
      <rect x="908" y="103" width="244" height="5" rx="2.5" fill="#a78bfa"/>
      <circle cx="936" cy="135" r="15" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="936" y="140" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">05</text>
      <text x="961" y="141" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750">SHIP · MEASURE · REFINE</text>
      <text x="928" y="179" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
        <tspan x="928" dy="0">Release deliberately.</tspan>
        <tspan x="928" dy="20">Measure the outcome, then</tspan>
        <tspan x="928" dy="20">turn learning into action.</tspan>
      </text>
    </g>
  </g>

  <path d="M1030 263C1030 320 170 320 170 263" fill="none" stroke="url(#loop-line)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#feedback-arrow)"/>
  <rect x="425" y="297" width="350" height="29" rx="14.5" fill="#0d192a" stroke="#28506a"/>
  <text x="600" y="316" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="0.8">LEARNING BECOMES THE NEXT INPUT</text>
</svg>
